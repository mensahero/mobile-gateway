name: APK Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > $GITHUB_WORKSPACE/keystore.jks

      - name: Build signed APK
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/keystore.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.SIGNING_STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.SIGNING_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Build signed Debug
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/keystore.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.SIGNING_STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.SIGNING_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Get tag name
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Rename Release APK
        run: mv app/release/app-release.apk mensahero-gateway-${{ steps.tag.outputs.version }}.apk

      - name: Rename Debug APK
        run: mv app/debug/app-debug.apk mensahero-gateway-${{ steps.tag.outputs.version }}-debug.apk

      - name: Generate Release Notes
        id: release_notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          RELEASE_NOTES="## 📱 Mensahero Mobile Gateway ${{ steps.tag.outputs.version }}"
          RELEASE_NOTES+=$'\n\n'
          
          if [ -n "$PREV_TAG" ]; then
            RELEASE_NOTES+="### 🌿 Merged Branches"$'\n'
            BRANCHES=$(git log $PREV_TAG..${{ steps.tag.outputs.version }} --pretty=format:"%D" | grep -oP 'origin/\K[^,)]+' | sort -u)
            if [ -n "$BRANCHES" ]; then
              while IFS= read -r branch; do
                RELEASE_NOTES+="- $branch"$'\n'
              done <<< "$BRANCHES"
            else
              RELEASE_NOTES+="- No branches merged"$'\n'
            fi
            RELEASE_NOTES+=$'\n'
          
            RELEASE_NOTES+="### 👥 Contributors"$'\n'
            CONTRIBUTORS=$(git log $PREV_TAG..${{ steps.tag.outputs.version }} --pretty=format:"%an" | sort -u)
            while IFS= read -r contributor; do
              RELEASE_NOTES+="- $contributor"$'\n'
            done <<< "$CONTRIBUTORS"
            RELEASE_NOTES+=$'\n'
          
            RELEASE_NOTES+="### 🔗 Closed Issues"$'\n'
            PR_COMMITS=$(git log $PREV_TAG..${{ steps.tag.outputs.version }} --pretty=format:"%B")
            ISSUES=$(echo "$PR_COMMITS" | grep -oP '(?: fixes|closes|resolves|fix|close|resolve)\s+#\K\d+' | sort -u)
            if [ -n "$ISSUES" ]; then
              while IFS= read -r issue; do
                RELEASE_NOTES+="- #$issue"$'\n'
              done <<< "$ISSUES"
            else
              RELEASE_NOTES+="- No issues closed"$'\n'
            fi
          else
            RELEASE_NOTES+="### 🎉 Initial Release"$'\n'
          fi
          
          RELEASE_NOTES="${RELEASE_NOTES//'%'/'%25'}"
          RELEASE_NOTES="${RELEASE_NOTES//$'\n'/'%0A'}"
          RELEASE_NOTES="${RELEASE_NOTES//$'\r'/'%0D'}"
          echo "notes=$RELEASE_NOTES" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: mensahero-gateway-${{ steps.tag.outputs.version }}.apk
          name: ${{ steps.tag.outputs.version }}
          body: ${{ steps.release_notes.outputs.notes }}
          tag_name: ${{ steps.tag.outputs.version }}
          draft: false
          prerelease: false