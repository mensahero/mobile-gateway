name: APK Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Get tag name and version info
        id: tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # Extract version name without 'v' prefix (e.g., v1.2.3 -> 1.2.3)
          VERSION_NAME=${VERSION#v}
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > $GITHUB_WORKSPACE/keystore.jks

      - name: Build signed Release APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/keystore.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.SIGNING_STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.SIGNING_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Build signed Debug APK
        run: |
          ./gradlew assembleDebug \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/keystore.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.SIGNING_STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.SIGNING_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Clean up keystore
        if: always()
        run: rm -f $GITHUB_WORKSPACE/keystore.jks

      - name: Rename and generate checksums for Release APK
        run: |
          mv app/release/app-release.apk mensahero-gateway-${{ steps.tag.outputs.version }}.apk
          sha256sum mensahero-gateway-${{ steps.tag.outputs.version }}.apk > mensahero-gateway-${{ steps.tag.outputs.version }}.apk.sha256

      - name: Rename and generate checksums for Debug APK
        run: |
          mv app/debug/app-debug.apk mensahero-gateway-${{ steps.tag.outputs.version }}-debug.apk
          sha256sum mensahero-gateway-${{ steps.tag.outputs.version }}-debug.apk > mensahero-gateway-${{ steps.tag.outputs.version }}-debug.apk.sha256

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-files
          path: |
            mensahero-gateway-${{ steps.tag.outputs.version }}.apk
            mensahero-gateway-${{ steps.tag.outputs.version }}-debug.apk
            *.sha256
          retention-days: 30

      - name: Generate Release Notes
        id: release_notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          RELEASE_NOTES="## 📱 Mensahero Mobile Gateway ${{ steps.tag.outputs.version }}"
          RELEASE_NOTES+=$'\n\n'
          
          if [ -n "$PREV_TAG" ]; then
            RELEASE_NOTES+="### 🌿 Merged Branches"$'\n'
            BRANCHES=$(git log $PREV_TAG..${{ steps.tag.outputs.version }} --pretty=format:"%D" | grep -oP 'origin/\K[^,)]+' | sort -u)
            if [ -n "$BRANCHES" ]; then
              while IFS= read -r branch; do
                RELEASE_NOTES+="- $branch"$'\n'
              done <<< "$BRANCHES"
            else
              RELEASE_NOTES+="- No branches merged"$'\n'
            fi
            RELEASE_NOTES+=$'\n'
          
            RELEASE_NOTES+="### Contributors"$'\n'
            CONTRIBUTORS=$(git log $PREV_TAG..${{ steps.tag.outputs.version }} --pretty=format:"%an" | sort -u)
            while IFS= read -r contributor; do
              RELEASE_NOTES+="- $contributor"$'\n'
            done <<< "$CONTRIBUTORS"
            RELEASE_NOTES+=$'\n'
          
            RELEASE_NOTES+="### Closed Issues"$'\n'
            PR_COMMITS=$(git log $PREV_TAG..${{ steps.tag.outputs.version }} --pretty=format:"%B")
            ISSUES=$(echo "$PR_COMMITS" | grep -oP '(?:fixes|closes|resolves|fix|close|resolve)\s+#\K\d+' | sort -u)
            if [ -n "$ISSUES" ]; then
              while IFS= read -r issue; do
                RELEASE_NOTES+="- #$issue"$'\n'
              done <<< "$ISSUES"
            else
              RELEASE_NOTES+="- No issues closed"$'\n'
            fi
          else
            RELEASE_NOTES+="### 🎉 Initial Release"$'\n'
          fi
          
          RELEASE_NOTES="${RELEASE_NOTES//'%'/'%25'}"
          RELEASE_NOTES="${RELEASE_NOTES//$'\n'/'%0A'}"
          RELEASE_NOTES="${RELEASE_NOTES//$'\r'/'%0D'}"
          echo "notes=$RELEASE_NOTES" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mensahero-gateway-${{ steps.tag.outputs.version }}.apk
            mensahero-gateway-${{ steps.tag.outputs.version }}-debug.apk
            mensahero-gateway-${{ steps.tag.outputs.version }}.apk.sha256
            mensahero-gateway-${{ steps.tag.outputs.version }}-debug.apk.sha256
          name: ${{ steps.tag.outputs.version }}
          body: ${{ steps.release_notes.outputs.notes }}
          tag_name: ${{ steps.tag.outputs.version }}
          draft: false
          prerelease: false

  update-version:
    needs: build
    runs-on: ubuntu-latest
    if: success()

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Get current version info
        id: current_version
        run: |
          # Read current version from gradle.properties
          CURRENT_VERSION_CODE=$(grep "appReleaseVersionCode=" gradle.properties | cut -d'=' -f2)
          CURRENT_VERSION_NAME=$(grep "appReleaseVersionName=" gradle.properties | cut -d'=' -f2)
          
          echo "current_code=$CURRENT_VERSION_CODE" >> $GITHUB_OUTPUT
          echo "current_name=$CURRENT_VERSION_NAME" >> $GITHUB_OUTPUT
          
          # Calculate new version code
          NEW_VERSION_CODE=$((CURRENT_VERSION_CODE + 1))
          echo "new_code=$NEW_VERSION_CODE" >> $GITHUB_OUTPUT
          
          # Get the tag version for new version name
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "new_name=$TAG_VERSION" >> $GITHUB_OUTPUT

      - name: Update gradle.properties
        run: |
          # Update version code
          sed -i "s/appReleaseVersionCode=.*/appReleaseVersionCode=${{ steps.current_version.outputs.new_code }}/" gradle.properties
          
          # Update version name to match the tag
          sed -i "s/appReleaseVersionName=.*/appReleaseVersionName=${{ steps.current_version.outputs.new_name }}/" gradle.properties
          
          # Display the changes
          echo "=== Updated gradle.properties ==="
          grep "appReleaseVersion" gradle.properties

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push version bump
        run: |
          git add gradle.properties
          git commit -m "chore: bump version to ${{ steps.current_version.outputs.new_code }} after release ${{ github.ref_name }}"
          git push origin main

      - name: Create version bump summary
        run: |
          echo "## Version Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Before | After |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version Code | ${{ steps.current_version.outputs.current_code }} | ${{ steps.current_version.outputs.new_code }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version Name | ${{ steps.current_version.outputs.current_name }} | ${{ steps.current_version.outputs.new_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Version updated successfully after release ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY